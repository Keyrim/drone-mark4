# drone-mark4 - development environment (consumed by devcontainer.json)
services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: drone-mark4-dev
    # Container <-> host UDP broadcast with zero configuration.
    network_mode: host
    # Keeps the container alive; VS Code attaches to it.
    command: sleep infinity
    init: true

    # USB probes (J-Link) and serial dongles (FTDI) attached to WSL with
    # usbipd reach the container through the /dev bind mount below; privileged
    # covers the device permissions without cgroup rule bookkeeping. Personal
    # development machine tradeoff, revisit if this compose ever leaves it.
    privileged: true

    # GPU acceleration for windowed Godot (WSLg / native X). Optional:
    # /dev/dri only exists when the host exposes a GPU (WSL vGPU, native
    # DRI) - uncomment if so; software rendering is enough otherwise.
    # devices:
    #   - /dev/dri:/dev/dri

    environment:
      DISPLAY: ${DISPLAY:-:0}
      WAYLAND_DISPLAY: ${WAYLAND_DISPLAY:-}
      XDG_RUNTIME_DIR: ${XDG_RUNTIME_DIR:-}

    volumes:
      # The repo, mounted where the devcontainer expects it.
      - ..:/workspaces/drone-mark4:cached
      # Persisted Claude Code and gh configuration (named volumes, targeted
      # by CLAUDE_CONFIG_DIR / GH_CONFIG_DIR defined in the Dockerfile):
      # logins survive image rebuilds.
      - claude-config:/home/dev/.claude
      - gh-config:/home/dev/.config/gh
      # Mobile app caches (Gradle, pub) and the adb pairing keys of the
      # phone: a rebuild of the image neither re-downloads Gradle nor asks
      # to pair the phone again.
      - gradle-cache:/home/dev/.gradle
      - pub-cache:/home/dev/.pub-cache
      - android-config:/home/dev/.android
      # X11 socket (WSLg or native X) for windowed Godot.
      - /tmp/.X11-unix:/tmp/.X11-unix
      # Host /dev, so USB devices hot-plugged after the container started
      # (usbipd attach / detach cycles) appear without a restart.
      - /dev:/dev

volumes:
  claude-config:
    name: drone-mark4-claude-config
  gh-config:
    name: drone-mark4-gh-config
  gradle-cache:
    name: drone-mark4-gradle-cache
  pub-cache:
    name: drone-mark4-pub-cache
  android-config:
    name: drone-mark4-android-config
