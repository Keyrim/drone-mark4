# drone-mark4 - development environment (consumed by devcontainer.json)
services:
  dev:
    # Pulled from GHCR, never built here: the image CI publishes (from
    # Dockerfile, tagged :latest on every main build) is the one every machine
    # runs, a single source of truth. pull_policy: missing means compose pulls
    # it once and then reuses the local copy, so to move to a newer image run
    #   docker pull ghcr.io/keyrim/drone-mark4-devcontainer:latest
    # then rebuild the container. To iterate on the Dockerfile locally, build
    # it under the same tag and rebuild (compose then finds it already local):
    #   docker build -t ghcr.io/keyrim/drone-mark4-devcontainer:latest .devcontainer
    image: ghcr.io/keyrim/drone-mark4-devcontainer:latest
    pull_policy: missing
    # Container <-> host UDP broadcast with zero configuration.
    network_mode: host
    # Keeps the container alive; VS Code attaches to it.
    command: sleep infinity
    init: true

    # USB probes (J-Link) and serial dongles (FTDI) attached to WSL with
    # usbipd reach the container through the /dev bind mount below; privileged
    # covers the device permissions without cgroup rule bookkeeping. Personal
    # development machine tradeoff, revisit if this compose ever leaves it.
    privileged: true

    # NVIDIA GPU (native Linux host): the nvidia-container-toolkit injects
    # the userspace driver libs matching the host driver. Requires the
    # toolkit on every host (on WSL it only feeds CUDA; the graphics path
    # there is the /usr/lib/wsl mount below).
    gpus: all

    environment:
      DISPLAY: ${DISPLAY:-:0}
      WAYLAND_DISPLAY: ${WAYLAND_DISPLAY:-}
      XDG_RUNTIME_DIR: ${XDG_RUNTIME_DIR:-}
      XAUTHORITY: /home/dev/.Xauthority
      # Make the toolkit inject the graphics libs too (default is compute).
      NVIDIA_DRIVER_CAPABILITIES: all
      # GPU acceleration for windowed Godot on WSL2: /dev/dxg comes with the
      # /dev bind mount below, Mesa's d3d12 driver is in the image, and the
      # WSL driver libs (libd3d12, libdxcore, libcuda) live here on the host.
      LD_LIBRARY_PATH: /usr/lib/wsl/lib

    volumes:
      # The repo, mounted where the devcontainer expects it.
      - ..:/workspaces/drone-mark4:cached
      # Persisted Claude Code and gh configuration (named volumes, targeted
      # by CLAUDE_CONFIG_DIR / GH_CONFIG_DIR defined in the Dockerfile):
      # logins survive image rebuilds.
      - claude-config:/home/dev/.claude
      - gh-config:/home/dev/.config/gh
      # Mobile app caches (Gradle, pub) and the adb pairing keys of the
      # phone: a rebuild of the image neither re-downloads Gradle nor asks
      # to pair the phone again.
      - gradle-cache:/home/dev/.gradle
      - pub-cache:/home/dev/.pub-cache
      - android-config:/home/dev/.android
      # WSL GPU driver libs, see LD_LIBRARY_PATH above.
      - /usr/lib/wsl:/usr/lib/wsl:ro
      # X11 socket (WSLg or native X) for windowed Godot.
      - /tmp/.X11-unix:/tmp/.X11-unix
      # X11 cookie exported by host-xauth.sh (initializeCommand). Empty on
      # WSLg, which accepts unauthenticated local connections.
      - ${HOME}/.drone-mark4-xauth:/home/dev/.Xauthority:ro
      # Host /dev, so USB devices hot-plugged after the container started
      # (usbipd attach / detach cycles) appear without a restart.
      - /dev:/dev

volumes:
  claude-config:
    name: drone-mark4-claude-config
  gh-config:
    name: drone-mark4-gh-config
  gradle-cache:
    name: drone-mark4-gradle-cache
  pub-cache:
    name: drone-mark4-pub-cache
  android-config:
    name: drone-mark4-android-config
