# dart:ffi binding of the C ABI of the transport (native/include/mark4/
# transport_shim.h), generated by tool/gen.sh into lib/gen/ (gitignored).
name: TransportBindings
description: >-
  Binding of libmark4_transport.so, the project's C++ transport behind the C
  ABI of native/include/mark4/transport_shim.h.
output: lib/gen/transport_bindings.dart
headers:
  entry-points:
    - native/include/mark4/transport_shim.h
  include-directives:
    - native/include/mark4/transport_shim.h
llvm-path:
  - /usr/lib/llvm-21
preamble: |
  // Generated by ffigen from native/include/mark4/transport_shim.h.
  // Do not edit: tool/gen.sh rewrites it.
  // ignore_for_file: type=lint
comments:
  style: any
  length: full
