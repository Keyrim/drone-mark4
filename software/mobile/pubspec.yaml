name: mark4
description: "Phone-as-gateway app of drone-mark4 (BLE gamepad -> phone -> UDP transport)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # Front: one BLoC per page, events and states are Equatable.
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  go_router: ^18.0.1
  flutter_screenutil: ^5.9.3
  # Back: managers expose their state as a BehaviorSubject (last value plus
  # changes), commands are methods returning a Future.
  rxdart: ^0.28.0
  shared_preferences: ^2.5.5
  logging: ^1.3.0
  # The wire: generated Dart codec of mark4.proto (tool/gen.sh), and the
  # 64-bit integers its messages carry.
  protobuf: ^6.0.0
  fixnum: ^1.1.1
  # The transport: generated dart:ffi binding of native/transport_shim.h.
  ffi: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  # Code generators driven by tool/gen.sh; pinned by pubspec.lock like every
  # other dependency, nothing installed globally.
  protoc_plugin: ^25.0.0
  ffigen: ^21.0.0

flutter:
  uses-material-design: true
