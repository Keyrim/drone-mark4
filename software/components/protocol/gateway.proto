// The wire between the gateway (the hub) and its websocket clients (the
// pages, a script). Two schemas rather than one because the two links have
// nothing in common: mark4.proto crosses a 921600 baud UART to a board with
// 128 kB of RAM and is bounded to the byte, while everything here travels
// over a loopback websocket between two desktop processes and can afford to
// be generous. The one rule the generosity still obeys is the union: every
// body of the oneof below shares one nanopb struct, so a body sized for
// comfort is paid by every message, and anything per-node and unbounded
// gets a message of its own instead of a field in Node.
//
// One GatewayMessage per websocket binary message, both directions.
// Nothing raw crosses: the gateway decodes everything it hears through its
// consumers and publishes what they hold as the typed messages below, and a
// client sends typed commands the gateway carries out through one consumer.
// A client never encodes an Envelope, and the only mark4.proto types it
// needs are the ones this schema imports. The codecs are generated at build
// time: nanopb for the hub, protoc-gen-es for the pages.

syntax = "proto3";

package mark4;

import "mark4.proto";

message GatewayMessage {
  // 1 was Frame, one encoded Envelope forwarded raw in both directions.
  // Never reuse.
  reserved 1;

  oneof body {
    NodeTable nodes = 2;
    GatewayStatus status = 3;
    OtaCommand ota_command = 10;
    OtaState ota_state = 11;
    ProfileCommand profile_command = 20;
    ProfileList profiles = 21;
    Profile profile = 22;
    Ack ack = 30;
    NodeTelemetry node_telemetry = 40;
    TelemetryCommand telemetry_command = 50;
    LogCommand log_command = 51;
    TuningCommand tuning_command = 52;
    PilotInput pilot_input = 53;
    NodeCommand node_command = 54;
    TransportCommand transport_command = 55;
    NodeLogModules node_log_modules = 60;
    NodeLogLines node_log_lines = 61;
    NodeStatus node_status = 62;
    NodeTelemetryConfig node_telemetry_config = 63;
    TelemetrySamples telemetry_samples = 64;
    NodeTuning node_tuning = 65;
    TuningResult tuning_result = 66;
    NodeTransport node_transport = 67;
    TransportHealth transport_health = 68;
    // 31 was the gateway's own Log: the gateway is a node and its lines
    // travel as NodeLogLines from its own node id like everyone else's.
    // Never reuse.
  }
  // Correlation id a client sets on a command (never 0); the gateway echoes
  // it on the Ack answering that command.
  uint32 id = 100;
}

// One node of the gateway's transport table, plus the last beacon it sent.
message Node {
  // 9 was the node's log module table, which is a message of its own now
  // (NodeLogModules): every body of the oneof is a union member, so one
  // node's fixed 32-module array cost 50 kB on every GatewayMessage.
  reserved 9;

  uint32 id = 1;
  string address = 2;          // IPv4 dotted, empty for the gateway itself
  uint32 port = 3;
  // 5, 6 and 7 were the gateway's own receive counters, which live in
  // NodeTransport now; never reuse.
  reserved 5, 6, 7;

  uint32 last_seen_ms_ago = 4;
  Announce announce = 8;       // absent until the node beaconed
}

// Client to gateway: what one node's telemetry stream carries, and who
// among the clients wants it.
message TelemetryCommand {
  uint32 node = 1;
  oneof action {
    // Replaces the node's configuration wholesale; last writer wins
    // between clients too, there is one configuration per node.
    TelemetryConfigRequest config = 2;
    // Marks or unmarks this client: the gateway holds the node's stream
    // while at least one client is marked.
    bool subscribe = 3;
  }
}

// The configuration a client asks a node for: the measures to sample and
// how often.
message TelemetryConfigRequest {
  repeated uint32 ids = 1;  // at most 64
  uint32 period_ms = 2;
}

// Client to gateway: one node's log table or one of its levels.
message LogCommand {
  uint32 node = 1;
  oneof action {
    bool refresh = 2;            // pull the module table again
    LogLevelRequest set_level = 3;
  }
}

// One module of one node moved to one level.
message LogLevelRequest {
  uint32 module_id = 1;
  LogLevel level = 2;
}

// Client to gateway: one node's parameter table, or one parameter.
message TuningCommand {
  uint32 node = 1;
  oneof action {
    bool refresh = 2;  // pull the parameter table again
    TuningSet set = 3;
    TuningGet get = 4;
  }
}

// Client to gateway: one pilot state for one node, forwarded once as an Rc
// from the gateway's own id. The gateway never repeats it: a client that
// stops sending stops the stream, and the node's own RC timeout does the
// rest. One pilot per node at a time; another client's input is refused
// while the seat is held.
message PilotInput {
  uint32 node = 1;
  Rc rc = 2;
}

// Client to gateway: one command the gateway sends to the node as a
// request of its own.
message NodeCommand {
  uint32 node = 1;
  oneof action {
    bool reboot = 2;
    SimScenario scenario = 3;
  }
}

// Client to gateway: this client wants the transport reports of every
// node. The gateway subscribes to the nodes while at least one client is
// marked, and unsubscribes when the last one clears or disconnects. Its own
// report needs no subscription and is always published.
message TransportCommand {
  bool subscribe = 1;
}

// Gateway to client: one node's whole telemetry table, as the gateway
// pulled it page by page. Published on every change and to every client
// that connects; a table the gateway dropped (the node went down) is
// published empty. Its own message rather than a Node field on purpose:
// a nanopb struct is its worst case, so 128 descriptors inside Node would
// make every GatewayMessage variable a few hundred kB.
message NodeTelemetry {
  uint32 node = 1;
  repeated TelemetryDescriptor descriptors = 2;  // the node's whole table
}

// Gateway to client: one node's whole log module table, as its consumer
// holds it. Published on every change and to every client that connects;
// a node that went down is published empty.
message NodeLogModules {
  uint32 node = 1;
  repeated LogModuleInfo modules = 2;  // 32 at most
}

// Gateway to client: log lines of one node. One line as it arrives, and
// the whole ring the gateway kept (oldest first) to a client that connects.
message NodeLogLines {
  uint32 node = 1;
  repeated Log lines = 2;  // 256 at most
}

// Gateway to client: the last report of one node, at that node's cadence.
message NodeStatus {
  uint32 node = 1;
  Status status = 2;
}

// Gateway to client: the telemetry configuration as the node applied it,
// and whether the gateway holds its sample stream.
message NodeTelemetryConfig {
  uint32 node = 1;
  repeated uint32 ids = 2;  // at most 64
  uint32 period_ms = 3;
  bool subscribed = 4;
}

// Gateway to client: one sampling instant of one node, to the clients
// marked on that node.
message TelemetrySamples {
  uint32 node = 1;
  TelemetryData data = 2;
}

// Gateway to client: one node's whole parameter table, as the gateway
// pulled it page by page.
message NodeTuning {
  uint32 node = 1;
  repeated TuningInfo infos = 2;  // 64 at most
}

// Gateway to client: the answer to a set or a get, to every client. They
// correlate on the id of their own command and on the parameter id.
message TuningResult {
  uint32 node = 1;
  TuningAck ack = 2;
}

// Gateway to client: one node's view of the transport, the last report it
// sent (pages merged) plus what the gateway derives from it over a sliding
// window. Published on every complete report; the gateway's own every
// second. A client that connects gets every one held.
message NodeTransport {
  uint32 node = 1;
  TransportReport report = 2;       // counters and links as reported; peers is empty here, the edges carry them
  uint32 window_ms = 3;             // span of the rates below, 0 while one report only
  repeated TransportLinkRate links = 4;   // one per report.links entry
  repeated TransportEdge edges = 5;       // one per peer the node holds, 32 at most
  TransportWindow window = 6;       // this node's own counters over the window
}

// One link of a node over the window.
message TransportLinkRate {
  float frames_in_per_s = 1;
  float bytes_in_per_s = 2;
  float frames_out_per_s = 3;
  float bytes_out_per_s = 4;
  uint32 refused = 5;    // over the window
  uint32 rx_errors = 6;  // over the window
}

// One directed edge: what the reporting node (the observer) counts of one
// peer, cumulative as reported and as rates over the window.
message TransportEdge {
  uint32 peer = 1;
  uint32 link = 2;             // index into NodeTransport.report.links
  uint32 hops = 3;
  uint32 age_ms = 4;
  uint32 received = 5;
  uint32 lost = 6;
  uint32 duplicates = 7;
  float rx_per_s = 8;          // frames per second over the window
  float loss = 9;              // lost / (received + lost) over the window, 0..1
  float duplicates_per_s = 10;
}

// A node's own counters over the window: what happened lately rather than
// since boot.
message TransportWindow {
  uint32 sent = 1;
  uint32 refused = 2;
  uint32 dropped = 3;
  uint32 relayed = 4;
  uint32 expired = 5;
  uint32 restarted = 6;
  uint32 requests = 7;
  uint32 resent = 8;
  uint32 failed = 9;
  uint32 undecodable = 10;
  uint32 unhandled = 11;
}

enum TransportVerdict {
  VERDICT_UNKNOWN = 0;   // nothing to judge yet
  VERDICT_OK = 1;
  VERDICT_DEGRADED = 2;
  VERDICT_BAD = 3;
}

// One node as the gateway judges it from every view it holds.
message TransportNodeHealth {
  uint32 node = 1;
  TransportVerdict verdict = 2;
  bool reporting = 3;        // a complete report of its own is held (the gateway itself always)
  float worst_in_loss = 4;   // worst loss over the edges this node observes
  float worst_out_loss = 5;  // worst loss over the edges other nodes observe of it
  bool fading = 6;           // some observer heard it more than 1.5 s ago
  bool asymmetric = 7;       // a reporting node lists it and it does not list that node back
  bool link_refused = 8;     // one of its links refused frames in the window
  bool link_rx_errors = 9;   // one of its links had receive errors in the window
  bool requests_failed = 10; // it gave up on requests in the window
  bool churn = 11;           // it expired or saw restart a peer in the window
}

// Gateway to client: the verdict on the whole transport, published every
// second and to a client that connects. With no client marked it is built
// from the gateway's own view alone, which nodes_reporting says.
message TransportHealth {
  TransportVerdict verdict = 1;
  uint32 nodes_known = 2;      // the node table, the gateway included
  uint32 nodes_reporting = 3;
  uint32 worst_observer = 4;   // the edge with the worst loss, 0 when none
  uint32 worst_peer = 5;
  float worst_loss = 6;
  float frames_per_s = 7;      // sum of rx_per_s over every edge held
  repeated TransportNodeHealth nodes = 8;   // one per node of the table, 33 at most
}

// The whole table, the gateway itself included as its first entry.
// Published every second and on every change.
message NodeTable {
  repeated Node nodes = 1;
}

// The gateway's own counters, published every second.
message GatewayStatus {
  uint32 node_id = 1;
  uint32 wire_hash = 2;     // hash of mark4.proto as built into the gateway
  uint32 clients = 3;       // websocket clients connected
  uint32 rc_clients = 4;    // pilot seats held, one per node at most
  uint32 messages_in = 5;   // transport payloads delivered to the gateway
  uint32 commands = 6;      // client commands carried out
  uint32 dropped = 7;       // transport frames dropped
  uint32 refused = 8;       // client commands refused
}

// Client to gateway: drive the firmware update client.
message OtaCommand {
  enum Op {
    OP_UNSPECIFIED = 0;
    START = 1;           // load bundle_path (empty = the build output) and update target_node
    ABORT = 2;           // drop the running session
    REVERT = 3;          // ask target_node to activate its other slot
    STATUS_REQUEST = 4;  // ask target_node what it runs
  }
  Op op = 1;
  uint32 target_node = 2;
  string bundle_path = 3;
}

// Gateway to client: the whole state of the update client, on every change
// and to every client that connects.
message OtaState {
  enum Phase {
    IDLE = 0;
    QUERY = 1;
    ERASING = 2;
    TRANSFER = 3;
    VERIFYING = 4;
    REBOOTING = 5;
    WAITING_BOARD = 6;
    TESTING = 7;
    CONFIRMED = 8;
    ROLLED_BACK = 9;
    REVERTING = 10;
    FAILED = 11;
  }
  enum Verdict {
    VERDICT_NONE = 0;
    VERDICT_CONFIRMED = 1;
    VERDICT_ROLLED_BACK = 2;
    VERDICT_REVERTED = 3;
    VERDICT_FAILED = 4;
  }
  message Bundle {
    bool loaded = 1;
    string path = 2;         // path a start would use, loaded or not
    string name = 3;
    uint32 mcu = 4;          // OTA_MCU_* of the images
    uint32 build_epoch = 5;
    string git_hash = 6;
    string wire_hash = 7;    // 8 hex characters
    uint32 image_count = 8;
  }
  message Board {
    bool seen = 1;
    Mcu mcu = 2;
    uint32 running_slot = 3;
    uint32 active_slot = 4;
    bool updater_busy = 5;
    repeated OtaSlotStatus slots = 6;  // 2
    uint32 slot_size = 7;
    uint32 max_chunk_data = 8;
  }
  message Progress {
    uint32 sent_bytes = 1;
    uint32 acked_bytes = 2;  // what the board wrote: the progress bar
    uint32 total_bytes = 3;
    uint32 retries = 4;
  }
  Phase phase = 1;
  Verdict verdict = 2;
  string verdict_text = 3;
  string last_error = 4;
  uint32 target_node = 5;   // node the session talks to, 0 = none yet
  int32 target_slot = 6;    // slot being filled, -1 outside a session
  Bundle bundle = 7;
  Board board = 8;
  Progress progress = 9;
}

// Client to gateway: the tuning profiles on the gateway's disk.
message ProfileCommand {
  enum Op {
    OP_UNSPECIFIED = 0;
    LIST = 1;  // answer: ProfileList
    SAVE = 2;  // name + values
    LOAD = 3;  // name; answer: Profile
    PUSH = 4;  // name + target_node: one parameter write per value
  }
  Op op = 1;
  string name = 2;
  repeated TuningSet values = 3;
  uint32 target_node = 4;
}

message ProfileList {
  repeated string names = 1;
}

message Profile {
  string name = 1;
  repeated TuningSet values = 2;
}

// Answer to a command that carried an id (echoed in GatewayMessage.id).
message Ack {
  bool ok = 1;
  string error = 2;
}
