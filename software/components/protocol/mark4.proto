// The one wire of the project. Every datagram and every serial frame
// between the flight processes, the board, the plant and the ground tools
// carries exactly one Envelope. The codecs are generated at build time:
// nanopb for C/C++ (mark4.options bounds every field so nothing allocates),
// godobuf for the Godot plant, protoc --python_out for the batch tool.
//
// Frames follow the project convention: body x forward, y left, z up,
// right-handed; world z up; quaternions rotate body into world, w first.
//
// Enum values are C-scoped inside the package, so two enums may not share
// a value name: the prefixes below exist for that reason only.

syntax = "proto3";

package mark4;

message Envelope {
  oneof body {
    Status status = 1;
    SimSensor sim_sensor = 2;
    SimActuator sim_actuator = 3;
    Rc rc = 4;
    Announce announce = 5;
    Log log = 6;
    LogModules log_modules = 7;
    LogControl log_control = 8;
    TelemetryListRequest telemetry_list_request = 9;
    TelemetryDescriptors telemetry_descriptors = 10;
    TelemetryEnable telemetry_enable = 11;
    TelemetryAck telemetry_ack = 12;
    TelemetryData telemetry_data = 13;
    SimScenario sim_scenario = 16;
    SimRunStats sim_run_stats = 17;
    Reboot reboot = 18;
    TuningSet tuning_set = 20;
    TuningGet tuning_get = 21;
    TuningList tuning_list = 22;
    TuningAck tuning_ack = 23;
    TuningInfo tuning_info = 24;
    OtaStatusRequest ota_status_request = 30;
    OtaStatus ota_status = 31;
    OtaBegin ota_begin = 32;
    OtaChunk ota_chunk = 33;
    OtaChunkAck ota_chunk_ack = 34;
    OtaFinish ota_finish = 35;
    OtaRevert ota_revert = 36;
    OtaAbort ota_abort = 37;
    OtaAck ota_ack = 38;
  }
}

// What kind of node is speaking.
enum NodeKind {
  NODE_KIND_UNSPECIFIED = 0;
  FIRMWARE = 1;   // the real board
  DRONE_SIM = 2;  // desktop flight process against the plant
  PLANT = 3;      // the physics simulator
  GATEWAY = 4;    // the hub
  BATCH = 5;      // a Monte Carlo campaign
  RELAY = 6;      // the ESP32 riding the drone, relaying between UART and LAN
  PHONE = 7;      // the pilot's phone: gamepad in hand, transport over Wi-Fi
}

// Target chip of a firmware image; a board refuses an image built for
// another one. The values are also what the on-flash image header stores.
enum Mcu {
  MCU_UNSPECIFIED = 0;
  STM32F405 = 1;
  STM32F722 = 2;
  ESP32C3 = 3;
  SIM = 200;  // desktop flight processes
}

// One node saying "here I am", beaconed every second.
message Announce {
  NodeKind kind = 1;
  string name = 2;           // free label, at most 16 characters
  Mcu mcu = 3;
  uint32 build_epoch = 4;    // packaging time [unix s], the build's identity
  string git_hash = 5;       // short commit hash, 8 hex characters
  uint32 wire_hash = 6;      // hash of this file, as built into the sender
}

// Same names and values as the flight core's FlightPhase.
enum FlightPhase {
  PHASE_IDLE = 0;
  PHASE_ALTITUDE_AUTO = 1;
  PHASE_ARMED = 2;
  PHASE_BALLISTIC = 3;
  PHASE_RECOVERY = 4;
  PHASE_HOVER = 5;
  PHASE_CUTOFF = 6;
  PHASE_MANUAL = 7;
  PHASE_FAULT = 8;   // IMU lost with the motors running, latched until the kill
}

// Same names and values as the flight core's ThrowState.
enum ThrowState {
  THROW_IDLE = 0;
  THROW_THRUST = 1;
  THROW_BALLISTIC = 2;
}

// Exact plant state, straight from the physics engine: no sensor model,
// no noise, no estimation. Only a simulator can produce it.
message PlantTruth {
  repeated float attitude_quat = 1;  // 4, w x y z
  repeated float position_m = 2;     // 3, world [m]
  repeated float velocity_mps = 3;   // 3, world [m/s]
}

// What the drone is doing: a small fixed report, always on, broadcast,
// decimated from the loop. It answers "where is it and is it healthy",
// which is what a control page, an attitude view and a campaign verdict
// need on every frame they paint. Everything that is a measurement rather
// than a state lives in the telemetry registry below instead: a field is
// added here only when every consumer of Status needs it.
message Status {
  uint64 timestamp_us = 1;           // acquisition time [us]
  repeated float attitude_quat = 2;  // 4, estimated attitude, w x y z
  repeated float motor = 3;          // 4, normalized motor commands [0, 1]
  FlightPhase flight_phase = 4;
  ThrowState throw_state = 5;
  uint32 throw_count = 6;            // throws detected since startup
  bool imu_valid = 7;                // the frame carried a fresh IMU sample
  bool baro_valid = 8;               // the frame carried a fresh baro sample
  optional PlantTruth truth = 9;     // the plant's exact state, sim only
}

// Physical dimension of one telemetry measure: what a ground tool labels an
// axis with, never a conversion (the values on the wire are already in
// these units).
enum TelemetryUnit {
  TELEMETRY_UNIT_UNITLESS = 0;   // ratios, quaternion components, enum codes, booleans as 0/1
  TELEMETRY_UNIT_M = 1;
  TELEMETRY_UNIT_M_PER_S = 2;
  TELEMETRY_UNIT_M_PER_S2 = 3;
  TELEMETRY_UNIT_RAD = 4;
  TELEMETRY_UNIT_RAD_PER_S = 5;
  TELEMETRY_UNIT_PA = 6;
  TELEMETRY_UNIT_CELSIUS = 7;
  TELEMETRY_UNIT_V = 8;
  TELEMETRY_UNIT_A = 9;
  TELEMETRY_UNIT_US = 10;
  TELEMETRY_UNIT_COUNT = 11;     // counters
}

// One measure a node exposes. id is its index in the node's frozen table,
// stable until the node reboots; name is the stable identity across
// reboots, so a ground tool binds by name and routes by id.
message TelemetryDescriptor {
  uint32 id = 1;
  string name = 2;  // hierarchical, "area/thing", at most 40 characters
  TelemetryUnit unit = 3;
}

// Ground to node, unicast: one page of the table, from cursor.
message TelemetryListRequest {
  uint32 cursor = 1;
}

// Node to requester, unicast: one page. The last page is the one where
// cursor + descriptors_count == total.
message TelemetryDescriptors {
  uint32 total = 1;
  uint32 cursor = 2;
  repeated TelemetryDescriptor descriptors = 3;  // at most 6 per page
}

// Subscriber to node, unicast: replaces the enabled set wholesale and
// (re)arms the stream. Sent again periodically as the keepalive; a node
// stops streaming when it stops hearing them. period_ms 0, or no id, stops
// the stream at once. One active stream per drone: an enable from another
// node takes it over.
message TelemetryEnable {
  repeated uint32 ids = 1;  // at most 64
  uint32 period_ms = 2;
}

// Node to subscriber, unicast, on every TelemetryEnable: what was applied.
message TelemetryAck {
  uint32 period_ms = 1;  // the period in effect, clamped
  uint32 enabled = 2;    // ids the node kept
}

message TelemetryValue {
  uint32 id = 1;
  float value = 2;
}

// Node to subscriber, unicast: one sampling instant, split into several
// messages when more than 32 values are enabled, all carrying the same
// timestamp.
message TelemetryData {
  uint64 timestamp_us = 1;
  repeated TelemetryValue values = 2;  // at most 32
}

// Same values as the flight core's PilotMode.
enum RcMode {
  RC_MANUAL = 0;         // the stick commands the collective directly
  RC_ALTITUDE_AUTO = 1;  // the stick commands a vertical velocity
}

// Pilot state, streamed at 10 Hz: the flight process treats a silent
// uplink as a kill, so holding a state means repeating it.
message Rc {
  bool kill = 1;
  bool arm = 2;
  RcMode mode = 3;
  float throttle = 4;  // normalized [0, 1]
}

// Resets the flight controller (or re-runs the boot decision of a desktop
// flight process).
message Reboot {}

// Same values as the log library's LogLevel; nothing persists them.
enum LogLevel {
  TRACE = 0;
  DEBUG = 1;
  INFO = 2;
  WARN = 3;
  ERROR = 4;
}

// One line of a node's log, broadcast. The module is named by id: the
// node's LogModules table gives the name.
message Log {
  uint64 timestamp_us = 1;
  LogLevel level = 2;
  uint32 module_id = 3;
  string text = 4;  // at most 96 characters
}

// One logging module of a node and its current threshold.
message LogModuleInfo {
  uint32 id = 1;
  string name = 2;  // hierarchical, "area/thing", at most 32 characters
  LogLevel level = 3;
}

// The node's module table, broadcast once after boot, on every level
// change and on a LogControl query, in pages of at most 8 modules: a
// whole table does not fit one frame.
message LogModules {
  uint32 start_index = 1;              // index of modules[0] in the table
  uint32 total = 2;                    // modules in the whole table
  repeated LogModuleInfo modules = 3;  // 8 at most
}

message LogModuleLevel {
  uint32 module_id = 1;
  LogLevel level = 2;
}

// Ground to node: ask for the table, or move one module's threshold. A
// client wanting a prefix ("platform/") sends one set per matching id.
message LogControl {
  oneof request {
    bool query = 1;
    LogModuleLevel set = 2;
  }
}

// Sensor frame of the plant, one per physics tick, lockstep link.
message SimSensor {
  uint64 timestamp_us = 1;           // simulation time at acquisition [us]
  repeated float gyro_rad_s = 2;     // 3, body angular rates [rad/s]
  repeated float accel_mps2 = 3;     // 3, specific force [m/s^2]
  float baro_pa = 4;                 // static pressure [Pa]
  uint32 reset_count = 5;            // world resets (teleports), wraps
  uint32 lockstep_timeouts = 6;      // ticks the plant gave up waiting on
  PlantTruth truth = 7;              // exact state at the same instant
}

// Actuator frame back to the plant; the echoed timestamp is the lockstep
// handshake.
message SimActuator {
  uint64 echo_timestamp_us = 1;  // timestamp of the sensor frame answered
  repeated float motor = 2;      // 4, normalized motor commands [0, 1]
}

enum SimScenarioKind {
  SIM_SCENARIO_UNSPECIFIED = 0;
  RESET = 1;       // teleport back to the start pose, reseed
  THROW = 3;       // reset, then an instant throw
  HAND_THROW = 4;  // reset, then a full hand sequence
}

// One whole run, scripted. A receiver plays a scenario once per change of
// sequence; every scenario opens with a reset and everything after it is
// scheduled by the plant on its own tick grid.
message SimScenario {
  uint32 sequence = 1;                       // 1..255, 0 = no scenario
  SimScenarioKind kind = 2;
  uint64 seed = 3;                           // seeds every generator of the run
  uint32 throw_delay_us = 4;                 // reset tick to throw or grab [us]
  uint32 hash_window_us = 5;                 // simulated time the flight process hashes
  repeated float velocity_mps = 6;           // 3, release velocity, world [m/s]
  repeated float angular_velocity_rad_s = 7; // 3, release spin, body [rad/s]
  float held_seconds = 8;                    // HAND_THROW: hold before the swing [s]
  float held_tilt_rad = 9;                   // HAND_THROW: held tilt from level [rad]
  float held_azimuth_rad = 10;               // HAND_THROW: world azimuth of the tilt [rad]
  float swing_seconds = 11;                  // HAND_THROW: swing duration, 0 = hold only [s]
}

// What one simulated run amounted to, republished on every change.
message SimRunStats {
  uint32 run_id = 1;             // reset counter of the measured run
  bool final = 2;                // the hash window elapsed, run_hash is final
  bool degraded = 3;             // the link lost a tick during the run
  uint64 run_start_us = 4;       // simulated time the run started at [us]
  uint64 run_hash = 5;           // hash of the trajectory so far
  uint32 duplicate_frames = 6;   // sensor resends answered again, cumulative
  uint32 lockstep_timeouts = 7;  // lockstep timeouts reported by the plant
}

// Same values as the flight core's TuningStatus.
enum TuningStatus {
  OK = 0;
  UNKNOWN_ID = 1;
  OUT_OF_BOUNDS = 2;
  LOCKED_WHILE_ARMED = 3;
}

message TuningSet {
  uint32 id = 1;
  float value = 2;
}

message TuningGet {
  uint32 id = 1;
}

message TuningList {
  uint32 start_index = 1;
}

// Answer to a set or get: the status and the value in effect afterwards.
message TuningAck {
  uint32 id = 1;
  float value = 2;
  TuningStatus status = 3;
}

// One parameter description, answering a list request.
message TuningInfo {
  uint32 index = 1;
  uint32 count = 2;
  uint32 id = 3;
  string name = 4;  // at most 16 characters
  float value = 5;
  float min_value = 6;
  float max_value = 7;
  bool armed_change = 8;
}

// Slot lifecycle states. The flash keeps its own encoding (0xFF = empty);
// the firmware codec maps between the two.
enum OtaSlotState {
  EMPTY = 0;
  STAGED = 1;
  TESTING = 2;
  VALID = 3;
  BAD = 4;
}

enum OtaResult {
  OTA_OK = 0;
  DENIED_ARMED = 1;
  DENIED_VOLTAGE = 2;
  DENIED_BUSY = 3;
  BAD_SESSION = 4;
  BAD_STATE = 5;
  BAD_IMAGE = 6;
  CRC_MISMATCH = 7;
  STORE_FAILURE = 8;
}

enum OtaOp {
  OTA_OP_UNSPECIFIED = 0;
  BEGIN = 1;
  CHUNK = 2;
  FINISH = 3;
  REVERT = 4;
  ABORT = 5;
}

message OtaSlotStatus {
  OtaSlotState state = 1;
  uint32 build_epoch = 2;  // 0 with no image header, 0xFFFFFFFF unpackaged
  string git_hash = 3;     // 8 hex characters, empty when unstamped
}

message OtaStatusRequest {}

message OtaStatus {
  Mcu mcu = 1;
  uint32 running_slot = 2;
  uint32 active_slot = 3;
  bool updater_busy = 4;
  repeated OtaSlotStatus slots = 5;  // 2
  uint32 slot_size = 6;
  uint32 max_chunk_data = 7;
}

message OtaBegin {
  uint32 session = 1;
  uint32 image_size = 2;
  uint32 image_crc = 3;
}

message OtaChunk {
  uint32 session = 1;
  uint32 offset = 2;
  bytes data = 3;  // at most 240 bytes
}

message OtaChunkAck {
  uint32 session = 1;
  uint32 next_offset = 2;
}

message OtaFinish {
  uint32 session = 1;
}

message OtaRevert {}

message OtaAbort {
  uint32 session = 1;
}

message OtaAck {
  uint32 session = 1;
  OtaOp op = 2;
  OtaResult result = 3;
}
