# Workflow 2: PR + main, parallel jobs, all INSIDE the devcontainer image.
#
# The image is pinned by digest so a re-run months later builds in the same
# environment and a push racing an image rebuild cannot flip environments
# mid-CI. After a .devcontainer/ change, bump the digest to the one pushed
# by devcontainer-image.yml:
#   docker manifest inspect ghcr.io/keyrim/drone-mark4-devcontainer:latest
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

# A superseded push must not keep burning runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: desktop (build + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/keyrim/drone-mark4-devcontainer@sha256:8e65c9a45affdaa62b4919a974cfbba8e4eca5b6a46183b58fcca4a84ca2a50a
      # The image runs as user "dev"; the runner's mounted workdirs belong to
      # another UID, so container jobs must run as root.
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cmake --preset desktop
        working-directory: software
      - run: cmake --build --preset desktop
        working-directory: software
      # The Godot project is imported once here: the build generated the
      # plant's codec into sim-godot/scripts/gen/, and the unit tests spawn
      # a headless Godot against it (a fresh checkout has no .godot cache).
      - run: godot --path sim-godot --headless --import
      - run: ctest --preset desktop
        working-directory: software
      # Cross-language end-to-end: the only check that runs the real physics,
      # the real flight core and the real wire against each other. The unit
      # tests prove the generated codecs agree on bytes; this proves a throw
      # still flies.
      - run: python3 tools/batch/run_batch.py --runs 1 --parallel 1 --time-scale 20
      # And the promise the campaign rests on: one seed, twice, one plant,
      # one hash. It fails on a mismatch, on a hash that never sealed, and
      # on a run that lost a lockstep tick.
      - run: python3 tools/batch/run_batch.py --verify-repro --seed 7

  stm32:
    name: stm32 (cross-compilation)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/keyrim/drone-mark4-devcontainer@sha256:8e65c9a45affdaa62b4919a974cfbba8e4eca5b6a46183b58fcca4a84ca2a50a
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cmake --preset stm32
        working-directory: software
      - run: cmake --build --preset stm32
        working-directory: software

  esp32:
    name: esp32 (bridge firmware)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/keyrim/drone-mark4-devcontainer@sha256:8e65c9a45affdaa62b4919a974cfbba8e4eca5b6a46183b58fcca4a84ca2a50a
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: idf.py -C esp32-bridge build

  desktop-san:
    name: desktop-san (ASan/UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/keyrim/drone-mark4-devcontainer@sha256:8e65c9a45affdaa62b4919a974cfbba8e4eca5b6a46183b58fcca4a84ca2a50a
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cmake --preset desktop-san
        working-directory: software
      - run: cmake --build --preset desktop-san
        working-directory: software
      # Same as the desktop job: the Godot tests need the imported project.
      - run: godot --path sim-godot --headless --import
      - run: ctest --preset desktop-san
        working-directory: software

  pages:
    name: pages (typecheck + build + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ghcr.io/keyrim/drone-mark4-devcontainer@sha256:8e65c9a45affdaa62b4919a974cfbba8e4eca5b6a46183b58fcca4a84ca2a50a
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: software/hub/pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  mobile:
    name: mobile (gen + analyze + test + debug apk)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/keyrim/drone-mark4-devcontainer@sha256:8e65c9a45affdaa62b4919a974cfbba8e4eca5b6a46183b58fcca4a84ca2a50a
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: software/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: flutter pub get
      # lib/gen/: protobuf codec, wire hash, ffigen binding (libclang of the image)
      - run: ./tool/gen.sh
      - run: flutter analyze
      - run: dart format --set-exit-if-changed lib test
      - run: flutter test
      # arm64 only: the one ABI of the phones this app targets, and a third
      # of the Gradle time of the default three-ABI debug build.
      - run: flutter build apk --debug --target-platform android-arm64

  format:
    name: clang-format + ascii
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ghcr.io/keyrim/drone-mark4-devcontainer@sha256:8e65c9a45affdaa62b4919a974cfbba8e4eca5b6a46183b58fcca4a84ca2a50a
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: git ls-files '*.cpp' '*.hpp' '*.c' '*.h' | xargs clang-format --dry-run --Werror
      - run: ./scripts/check_ascii.sh

  tidy:
    name: clang-tidy (desktop + stm32)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/keyrim/drone-mark4-devcontainer@sha256:8e65c9a45affdaa62b4919a974cfbba8e4eca5b6a46183b58fcca4a84ca2a50a
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cmake --preset desktop && cmake --build --preset desktop --target protocol nanopb_gateway
        working-directory: software
      - run: run-clang-tidy -p software/build/desktop -quiet "$(pwd)/software/(components|drone_sim|drone_firmware|hub|tests)/"
      - run: cmake --preset stm32 && cmake --build --preset stm32 --target protocol
        working-directory: software
      - run: ./scripts/tidy_stm32.sh
