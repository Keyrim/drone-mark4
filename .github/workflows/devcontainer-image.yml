# Workflow 1: build the devcontainer image -> push to GHCR whenever the
# Dockerfile changes. Every ci.yml job runs INSIDE this image (a single
# source of truth for the environment).
name: devcontainer-image

on:
  push:
    branches: [main]
    paths:
      - ".devcontainer/**"
      - ".github/workflows/devcontainer-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .devcontainer
          push: true
          tags: |
            ghcr.io/keyrim/drone-mark4-devcontainer:latest
            ghcr.io/keyrim/drone-mark4-devcontainer:${{ github.sha }}
